services:
  api:
    build: .
    ports:
      - "8004:8000"
    volumes:
      - ./geoip_database:/app/geoip_database
    depends_on:
      geoipupdate-init:
        condition: service_completed_successfully

  geoipupdate-init:
    image: ghcr.io/maxmind/geoipupdate
    env_file:
      - .env
    environment:
      GEOIPUPDATE_FREQUENCY: 0
      GEOIPUPDATE_VERBOSE: 1
    volumes:
      - ./geoip_database:/usr/share/GeoIP
    command: ["geoipupdate"]

  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate
    env_file:
      - .env
    volumes:
      - ./geoip_database:/usr/share/GeoIP
    depends_on:
      geoipupdate-init:
        condition: service_completed_successfully
    restart: unless-stopped

  geoipupdate-alert:
    image: python:3.12-alpine
    profiles:
      - alerts
    env_file:
      - .env
    environment:
      GEOIP_DB_DIR: /usr/share/GeoIP
      GEOIP_ALERT_MAX_AGE_HOURS: 48
      GEOIP_ALERT_CHECK_INTERVAL_SECONDS: 3600
      GEOIP_ALERT_RESEND_INTERVAL_SECONDS: 21600
    volumes:
      - ./geoip_database:/usr/share/GeoIP:ro
      - ./app/utils/geoip_update_alert.py:/app/geoip_update_alert.py:ro
    command: ["python", "/app/geoip_update_alert.py"]
    depends_on:
      geoipupdate-init:
        condition: service_completed_successfully
    restart: unless-stopped
